  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* hero */
    #hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: radial-gradient(ellipse at 50% 40%, #fdfaf3 0%, var(--ivory) 70%)
    }

    #hero::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid var(--gold-soft);
      pointer-events: none
    }

    #hero::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(184, 152, 90, .25);
      pointer-events: none
    }

    .mono {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .2em;
      color: var(--gold);
      margin-bottom: 34px;
      padding-left: .2em
    }

    .date {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .14em;
      margin-top: 34px
    }

    .day {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 2px
    }

    .tag {
      margin: 28px 0 38px;
      color: var(--mute);
      font-size: .9rem
    }

    .btn {
      display: inline-block;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 14px 34px;
      font: 400 .72rem var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: transform .35s ease, background .35s ease, border-color .35s ease
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.03);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }

    #hero {
      position: fixed;
      inset: 0;
      z-index: 20;
      transition: opacity .9s ease, visibility .9s
    }

    #hero.leaving {
      opacity: 0;
      visibility: hidden
    }

    .arch {
      width: min(34vw, 160px, calc(22svh*.75));
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      padding: 5px;
      margin-bottom: clamp(18px, 4svh, 32px)
    }

    .arch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media (min-width: 768px) {
      .cover {
        width: 100%;
        max-width: 100%;
        height: 100vh;
        min-height: 100vh;
        aspect-ratio: auto;
        margin: 0 auto;
        -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
      }

      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 22%;
      }

      #intro .wrap {
        margin-top: clamp(36px, 6vw, 72px);
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gal {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 26%;
      text-align: left
    }

    .ph {
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(60, 50, 30, .12);
      background: var(--cream)
    }

    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
      transition: transform 2.6s ease
    }

    .in.ph img,
    .in .ph img {
      transform: none
    }

    .ga {
      width: 80%;
      aspect-ratio: 4/5
    }

    .ga img {
      object-position: 50% 28%
    }

    .gb {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 54%;
      aspect-ratio: 3/4;
      border: 6px solid var(--ivory)
    }

    .gb img {
      object-position: 50% 36%
    }

    @media(prefers-reduced-motion:reduce) {
      .ph img {
        transition: none;
        transform: none
      }
    }

    /* hero sequence */
    .seq {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      animation: seq .6s ease forwards;
      animation-delay: calc(var(--i)*.16s + .05s)
    }

    @keyframes seq {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* reveal */
    .r {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease
    }

    .r.in {
      opacity: 1;
      transform: none
    }

    .line-x {
      transform: scaleX(0);
      transition: transform 1.1s ease
    }

    .in .line-x,
    .line-x.in {
      transform: scaleX(1)
    }

    /* date */
    .daynum {
      font-family: var(--serif);
      font-size: clamp(6rem, 30vw, 10rem);
      line-height: .9;
      font-weight: 300;
      color: var(--ink)
    }

    .month {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      margin-top: 8px;
      padding-left: .3em
    }

    .time {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin-top: 8px
    }

    .pin {
      width: 22px;
      height: 22px;
      color: var(--gold);
      margin-bottom: 18px
    }

    .note {
      font-family: var(--serif);
      font-style: italic;
      color: var(--mute);
      font-size: 1.15rem;
      margin-top: 22px
    }

    /* families */
    .fam {
      display: grid;
      gap: 56px;
      max-width: 860px;
      margin: 56px auto 0
    }

    .fam h3 {
      font-size: 1.6rem;
      line-height: 1.3;
      margin: 0 0 14px
    }

    .fam .label {
      margin-bottom: 18px
    }

    .fam p {
      margin: 0;
      color: var(--mute);
      font-size: .95rem
    }

    .fam .sep {
      width: 1px;
      height: 56px;
      background: var(--gold-soft);
      margin: 0 auto;
      display: none
    }

    @media(min-width:760px) {
      .fam {
        grid-template-columns: 1fr 1px 1fr;
        gap: 48px;
        align-items: start
      }

      .fam .sep {
        display: block;
        height: 100%;
        min-height: 200px
      }
    }

    .couple-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 16px;
    }
    .couple-name {
      font-family: var(--serif);
      font-size: clamp(2rem, 5.5vw, 2.6rem);
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.04em;
      margin: 0;
    }
    .couple-rule {
      width: 44px;
      height: 1px;
      background: var(--gold);
      margin: 14px auto 16px;
    }
    .couple-sentence {
      font-family: var(--serif);
      font-size: clamp(1.22rem, 3.8vw, 1.5rem);
      line-height: 1.6;
      color: var(--ink);
      margin: 0;
      max-width: 32ch;
    }
    .couple-sentence .relation-tag {
      font-family: var(--sans);
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      display: inline-block;
      margin-right: 6px;
    }


    .comp {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 4.3vw, 1.35rem);
      line-height: 1.9
    }

    .comp span {
      padding: 0 clamp(10px, 3vw, 20px);
      white-space: nowrap
    }

    .comp span+span {
      border-left: 1px solid var(--gold-soft)
    }

    .foot {
      padding: 48px 24px 56px;
      text-align: center;
      border-top: 1px solid var(--gold-soft)
    }

    .foot .serif {
      font-size: 1.4rem;
      letter-spacing: .2em
    }

    @media(prefers-reduced-motion:reduce) {

      .seq,
      .r,
      .line-x {
        animation: none;
        transition: none;
        opacity: 1;
        transform: none
      }

      html {
        scroll-behavior: auto
      }
    }

    .cover {
      position: relative !important;
      overflow: hidden !important;
    }

    #rose-petals-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      pointer-events: none !important;
      z-index: 50 !important;
    }

    /* ===== Countdown Timer ===== */
    .countdown-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2.5vw, 18px);
      margin-top: clamp(28px, 6vw, 42px);
      user-select: none;
      -webkit-user-select: none;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: clamp(56px, 16vw, 84px);
      padding: clamp(10px, 2.5vw, 16px) clamp(8px, 2vw, 16px);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--gold-soft);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(184, 152, 90, 0.12), 0 1px 3px rgba(0, 0, 0, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .countdown-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(184, 152, 90, 0.22);
    }

    .countdown-num {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 5.5vw, 2.6rem);
      font-weight: 500;
      line-height: 1.1;
      color: var(--ink);
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .countdown-label {
      font-family: var(--sans);
      font-size: clamp(0.65rem, 1.8vw, 0.76rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 5px;
    }

    .countdown-colon {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--gold-soft);
      margin-bottom: clamp(12px, 3vw, 18px);
      font-weight: 300;
    }
  </style>
</head>

<body>
  <audio id="wedding-audio" src="/wedding.mp3" loop preload="auto">
    <source src="/wedding.mp3" type="audio/mpeg">
  </audio>
  <main id="app"></main>
  <footer class="foot">
    <div class="serif" id="fmono"></div>
    <div class="small" style="margin-top:8px" id="fdate"></div>
  </footer>

  <script>
    /* ===== Central wedding data — edit here only ===== */
    const W = {
      bride: "Arsha", groom: "Arjun", brideFirst: "Arsha", groomFirst: "Arjun", monogram: "A • A", footMono: "A & A",
      short: "Arjun & Arsha",
      date: { full: "22 November 2026", day: "Sunday", num: "22", month: "November 2026", dots: "22 • 11 • 2026", dotted: "22.11.2026" },
      ceremony: {
        venue: "Guruvayur Sree Krishna Temple",
        muhurtham: "6:00 AM",
        address: "East Nada, Guruvayur, Thrissur, Kerala – 680101.",
        map: "https://www.google.com/maps/search/?api=1&query=Guruvayur+Sree+Krishna+Temple+Guruvayur+Kerala"
      },
      reception: {
        venue: "KR Thekkedathu Mana",
        time: "11:00 AM – 1:00 PM",
        address: [
          "KR Thekkedathu Mana,",
          "Kadangod P.O., Erumapetty Via,",
          "Thrissur, Kerala – 680584."
        ],
        map: "https://share.google/89qt5kDbmUhvB5mPj"
      },
      parents: {
        bride: {
          title: "Bride's Parents",
          father: "Anilkumar R",
          mother: "Jainy K S (Late)"
        },
        groom: {
          title: "Groom's Parents",
          father: "Yetheendran K",
          mother: "Shylaja O P"
        }
      },
      couple: {
        groom: {
          name: "Arjun",
          relation: "S/O",
          father: "Yetheendran K",
          mother: "Shylaja O P"
        },
        bride: {
          name: "Arsha",
          relation: "D/O",
          father: "Anilkumar R",
          mother: "Jainy K S (Late)"
        }
      },
      tagline: "A celebration of love, family & togetherness",
      quotes: ["Our love began as a story, and today we make a promise to turn it into forever.", "A beautiful marriage is not something you find, it is something you build together."],
      invite: "We cordially invite your gracious presence and blessings on the auspicious occasion of the wedding ceremony of Arjun & Arsha."
    };
    const PHOTOS = {
      a: "/assets/img2.webp",
      b: "/assets/preview.webp"
    };
    /* ===== Render ===== */
    const orn = '<svg class="orn r" viewBox="0 0 150 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 9h55M95 9h55"/><circle cx="75" cy="9" r="4"/><circle cx="65" cy="9" r="2.5"/><circle cx="85" cy="9" r="2.5"/></svg>';
    const pin = '<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>';
    const D = W.date;
    document.getElementById('app').innerHTML = `
<section id="hero">
  <div class="arch seq" style="--i:0"><img src="${PHOTOS.b}" alt="Arsha and Arjun" decoding="async"></div>
  <h1 class="names"><span class="seq" style="--i:1;display:block">${W.groomFirst}</span><span class="amp seq" style="--i:2">&amp;</span><span class="seq" style="--i:3;display:block">${W.brideFirst}</span></h1>
  <div class="date seq" style="--i:4">${D.full}</div>
  <div class="day seq" style="--i:4">${D.day}</div>
  <p class="tag seq" style="--i:5">${W.tagline}</p>
  <a class="btn seq" style="--i:6" href="#intro">Open Invitation</a>
</section>

<section id="intro">
  <div class="cover r">
    <img src="${PHOTOS.a}" alt="Arjun and Arsha" decoding="async">
    <canvas id="rose-petals-canvas" aria-hidden="true"></canvas>
  </div>
  <div class="wrap">
    <p class="label r">Together with their families</p>
    <h2 class="intro-names r" aria-label="${W.groom} & ${W.bride}">
      <div class="script-line script-groom">
        <span class="script-text">${W.groom}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="script-line script-amp" aria-hidden="true">
        <span class="amp">&amp;</span>
      </div>
      <div class="script-line script-bride">
        <span class="script-text">${W.bride}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="flourish-wrap" aria-hidden="true">
        <svg class="calligraphy-flourish" viewBox="0 0 280 26" fill="none" preserveAspectRatio="none">
          <path class="flourish-path" d="M14,14 C65,4 105,6 140,16 C175,24 215,10 266,8" stroke="url(#goldFlourishGrad)" stroke-width="2.2" stroke-linecap="round" />
          <defs>
            <linearGradient id="goldFlourishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(220, 201, 160, 0.2)" />
              <stop offset="35%" stop-color="rgba(184, 152, 90, 0.95)" />
              <stop offset="70%" stop-color="rgba(218, 165, 32, 0.95)" />
              <stop offset="100%" stop-color="rgba(220, 201, 160, 0.2)" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </h2>
    ${orn}
    <p class="quote r">“${W.quotes[0]}”</p>
  </div>
</section>

<section class="alt"><div class="wrap">
  <p class="label r">The wedding</p>
  <div class="daynum r">${D.num}</div>
  <div class="month r">${D.month.toUpperCase()}</div>
  <div class="day r" style="margin-top:10px">${D.day}</div>
  <div class="rule line-x r"></div>
  <div class="time r">Muhurtham: ${W.ceremony.muhurtham}</div>
  <div class="countdown-container r" id="wedding-countdown" role="timer" aria-label="Countdown to Wedding">
    <div class="countdown-item">
      <span class="countdown-num" id="cd-days">--</span>
      <span class="countdown-label">Days</span>
    </div>
    <span class="countdown-colon" aria-hidden="true">:</span>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-hours">--</span>
      <span class="countdown-label">Hours</span>
    </div>
    <span class="countdown-colon" aria-hidden="true">:</span>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-minutes">--</span>
      <span class="countdown-label">Mins</span>
    </div>
    <span class="countdown-colon" aria-hidden="true">:</span>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-seconds">--</span>
      <span class="countdown-label">Secs</span>
    </div>
  </div>
</div></section>

<section><div class="wrap">
  <p class="label r">Wedding Ceremony</p>
  <div class="r">${pin}</div>
  <h2 class="big r">${W.ceremony.venue}</h2>
  <div class="time r" style="margin-top:14px;font-size:clamp(1.2rem,4vw,1.5rem);color:var(--gold)">Muhurtham: ${W.ceremony.muhurtham}</div>
  <p class="small r" style="margin-top:10px;font-size:1.05rem;line-height:1.7;color:var(--mute)">${W.ceremony.address}</p>
  <div style="margin-top:28px" class="r">
    <a class="btn" href="${W.ceremony.map}" target="_blank" rel="noopener noreferrer">View Location on Google Maps</a>
  </div>
</div></section>

<section class="alt"><div class="wrap">
  <p class="label r">Reception Details</p>
  <div class="r">${pin}</div>
  <h2 class="big r">${W.reception.venue}</h2>
  <div class="time r" style="margin-top:14px;font-size:clamp(1.2rem,4vw,1.5rem);color:var(--gold)">Reception Time: ${W.reception.time}</div>
  <p class="small r" style="margin-top:10px;font-size:1.05rem;line-height:1.7;color:var(--mute)">${W.reception.address.join('<br>')}</p>
  <div style="margin-top:28px" class="r">
    <a class="btn" href="${W.reception.map}" target="_blank" rel="noopener noreferrer">View Location on Google Maps</a>
  </div>
</div></section>

<section><div class="wrap">
  ${orn}
  <p class="body r">${W.invite}</p>
  ${orn}
</div></section>

<section class="alt"><div class="wrap" style="max-width:900px">
  <p class="label r">The Couple</p>
  <div class="fam">
    ${coupleCard(W.couple.groom)}
    <div class="sep line-x"></div>
    ${coupleCard(W.couple.bride)}
  </div>
</div></section>

<section style="background:linear-gradient(180deg,var(--ivory),var(--blush) 55%,var(--ivory))"><div class="wrap">
  <div class="rule line-x r" style="margin-top:0"></div>
  <p class="quote r">“${W.quotes[1]}”</p>
  <div class="rule line-x r"></div>
</div></section>

<section><div class="wrap" style="max-width:560px">
  <div class="gal">
    <div class="ph ga r"><img src="${PHOTOS.a}" alt="Arjun and Arsha" loading="lazy" decoding="async"></div>
    <div class="ph gb r"><img src="${PHOTOS.b}" alt="Arjun and Arsha" loading="lazy" decoding="async"></div>
  </div>
</div></section>

<section style="padding-block:clamp(100px,22vw,200px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.2rem,9vw,3.4rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love and blessings</p>
  ${orn}
</div></section>`;

    function coupleCard(person) {
      return `<div class="r couple-card">
  <h3 class="couple-name">${person.name}</h3>
  <div class="couple-rule line-x"></div>
  <p class="couple-sentence"><span class="relation-tag">${person.relation}</span> ${person.father} &amp; ${person.mother}</p>
</div>`;
    }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Wedding Countdown Timer ===== */
    (function initCountdown() {
      const target = new Date('2026-11-22T06:00:00+05:30').getTime();
      const elD = document.getElementById('cd-days');
      const elH = document.getElementById('cd-hours');
      const elM = document.getElementById('cd-minutes');
      const elS = document.getElementById('cd-seconds');
      if (!elD || !elH || !elM || !elS) return;
      function tick() {
        const diff = target - Date.now();
        if (diff <= 0) {
          elD.textContent = '00'; elH.textContent = '00'; elM.textContent = '00'; elS.textContent = '00';
          return;
        }
        const s = Math.floor(diff / 1000);
        elD.textContent = String(Math.floor(s / 86400));
        elH.textContent = String(Math.floor((s % 86400) / 3600)).padStart(2, '0');
        elM.textContent = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
        elS.textContent = String(s % 60).padStart(2, '0');
      }
      tick();
      setInterval(tick, 1000);
    })();

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      document.getElementById('hero').classList.add('leaving');
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
      initRosePetals();
    }
    document.querySelector('#hero .btn').addEventListener('click', e => { e.preventDefault(); openInvite() });

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');

    function playAudio() {
      if (!audio) return;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }

    /* ===== Falling Rose Petals (Confined to .cover only, small 3D) ===== */
    let petalsActive = false;
    function initRosePetals() {
      if (petalsActive) return;
      petalsActive = true;
      const cover = document.querySelector('.cover');
      if (!cover) return;

      const ROSE_PALETTES = [
        { front: ['#a81b2c', '#c72438', '#7a0e1c'], back: ['#580812', '#720c19'] },
        { front: ['#921424', '#b51d31', '#6b0b17'], back: ['#4b060e', '#610a14'] },
        { front: ['#ba2136', '#db324b', '#8f1224'], back: ['#630a17', '#7c1020'] },
        { front: ['#d94d65', '#eb6880', '#ad3249'], back: ['#8c1e32', '#a82941'] },
        { front: ['#82101e', '#9e1728', '#5e0813'], back: ['#3e040a', '#540710'] }
      ];
      let canvas = document.getElementById('rose-petals-canvas');
      if (!canvas) {
        canvas = document.createElement('canvas');
        canvas.id = 'rose-petals-canvas';
        canvas.setAttribute('aria-hidden', 'true');
        document.body.appendChild(canvas);
      } else if (canvas.parentElement !== document.body) {
        document.body.appendChild(canvas);
      }
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100vw';
      canvas.style.height = '100vh';
      canvas.style.pointerEvents = 'none';
      canvas.style.zIndex = '50';
      canvas.style.opacity = '0';
      canvas.style.transition = 'opacity 1.5s ease';

      requestAnimationFrame(() => { canvas.style.opacity = '1'; });
      const ctx = canvas.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      let width = window.innerWidth;
      let height = window.innerHeight;
      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = '100vw';
        canvas.style.height = '100vh';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      function spawnPetal(initial) {
        const depth = Math.random();
        // Tiny 3D delicate petals: 4.5px to 10px
        const size = depth < 0.35 ? 4.5 + Math.random() * 1.8 : (depth < 0.8 ? 6.2 + Math.random() * 2.0 : 8.2 + Math.random() * 2.2);
        const speedY = depth < 0.35 ? 0.22 + Math.random() * 0.14 : (depth < 0.8 ? 0.30 + Math.random() * 0.16 : 0.38 + Math.random() * 0.18);
        return {
          x: Math.random() * (width + 40) - 20,
          y: initial ? Math.random() * (height + 40) - 20 : -18 - Math.random() * 25,
          size,
          aspect: 0.70 + Math.random() * 0.16,
          speedY,
          speedX: -0.08 + Math.random() * 0.18,
          angle: Math.random() * Math.PI * 2,
          angleSpeed: (Math.random() - 0.5) * 0.006,
          flip: Math.random() * Math.PI * 2,
          flipSpeed: 0.007 + Math.random() * 0.012,
          pitch: Math.random() * Math.PI * 2,
          pitchSpeed: 0.009 + Math.random() * 0.014,
          swayPhase: Math.random() * Math.PI * 2,
          swaySpeed: 0.006 + Math.random() * 0.009,
          swayAmp: 7 + Math.random() * 10,
          curl: (Math.random() - 0.5) * 0.6,
          palette: ROSE_PALETTES[Math.floor(Math.random() * ROSE_PALETTES.length)],
          opacity: 0.7 + Math.random() * 0.25
        };
      }

      const count = width < 768 ? 16 : 22;
      const petals = [];
      for (let i = 0; i < count; i++) petals.push(spawnPetal(true));

      let lastTime = performance.now();
      let animId = null;

      function drawPetal(p) {
        const w = p.size * p.aspect;
        const h = p.size;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        const flipCos = Math.cos(p.flip);
        const pitchSin = Math.sin(p.pitch);
        ctx.scale(flipCos, 0.93 + pitchSin * 0.07);
        ctx.globalAlpha = p.opacity;
        const isBack = flipCos < 0;
        const colors = isBack ? p.palette.back : p.palette.front;
        const grad = ctx.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(0.5, colors[1]);
        grad.addColorStop(1, colors[colors.length - 1]);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, h * 0.48);
        ctx.bezierCurveTo(-w * 0.58, h * 0.22, -w * 0.65, -h * 0.22, -w * 0.22, -h * 0.48);
        ctx.bezierCurveTo(-w * 0.08, -h * 0.51, w * 0.08, -h * 0.51, w * 0.22, -h * 0.48);
        ctx.bezierCurveTo(w * 0.65, -h * 0.22, w * 0.58, h * 0.22, 0, h * 0.48);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = isBack ? 'rgba(255, 190, 190, 0.14)' : 'rgba(255, 240, 240, 0.22)';
        ctx.lineWidth = Math.max(0.4, w * 0.04);
        ctx.beginPath();
        ctx.moveTo(0, h * 0.42);
        ctx.quadraticCurveTo(p.curl * w * 0.22, 0, 0, -h * 0.38);
        ctx.stroke();
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min((now - lastTime) / 16.667, 2.0);
        lastTime = now;
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < petals.length; i++) {
          const p = petals[i];
          const sway = Math.cos(now * 0.001 * p.swaySpeed + p.swayPhase) * (p.swayAmp * 0.022);
          p.y += p.speedY * dt;
          p.x += (p.speedX + 0.05 + sway) * dt;
          p.angle += p.angleSpeed * dt;
          p.flip += p.flipSpeed * dt;
          p.pitch += p.pitchSpeed * dt;
          if (p.y > height + 25) {
            p.y = -15 - Math.random() * 25;
            p.x = Math.random() * (width + 40) - 20;
          }
          if (p.x < -30) p.x = width + 20;
          else if (p.x > width + 30) p.x = -20;
          drawPetal(p);
        }
        animId = requestAnimationFrame(loop);
      }

      if (!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
        animId = requestAnimationFrame(loop);
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            if (animId) cancelAnimationFrame(animId);
          } else {
            lastTime = performance.now();
            animId = requestAnimationFrame(loop);
          }
        });
    }
  </script>
</body>

</html>
